# Example training run configuration.
#
# Usage: python tools/train.py --config configs/train_example.yaml
#
# Precedence: CLI flags > this YAML > adapter defaults.
# Every key maps to the same-named CLI parameter; unknown keys are rejected.
run:
  annotation_run_id: annot_example
  model: qwen3vl
  model_path: models/Qwen3-VL-8B-Instruct
  data_dir: data
  seed: 42
  num_workers: 4
  checkpoint_interval: 20
  run_tag: qwen3vl-r1
# Experiment knobs (override the adapter recipe; all values enter the run identity).
# Model-fixed attributes (pixel budget, LoRA target regex, compute dtype) stay in
# the adapter and are not configurable here.
hyperparameters:
  batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 1.0e-4
  epochs: 3
  eval_batch_size: 1
  best_metric: acc_at_0_5
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.05
  warmup_ratio: 0.05
  lr_scheduler_type: cosine
  max_grad_norm: 1.0
  weight_decay: 0.01

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "query-foundry"
version = "0.1.0"
description = "Visual grounding annotation pipeline: census, assembly, and review tools"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
pipeline = ["Pillow", "numpy"]

[project.urls]
Homepage = "https://github.com/FanGou-code/query-foundry"
Repository = "https://github.com/FanGou-code/query-foundry"
Issues = "https://github.com/FanGou-code/query-foundry/issues"

[tool.setuptools.packages.find]
include = ["foundry*", "scripts*"]

# Example inference run configuration.
#
# Usage: python tools/infer.py --config configs/infer_example.yaml
#
# Precedence: CLI flags > this YAML > defaults.
# Inference has no hyperparameters section; providing one is an error.
run:
  model: qwen3vl
  model_path: models/Qwen3-VL-8B-Instruct
  lora_path: outputs/training/<train_run_id>/best/epoch_03
  test_json: data/Test/queries/queries.json
  data_dir: data
  batch_size: 2
  num_shards: 1
  num_workers: 2
  batch_save: 100
  run_tag: test-full

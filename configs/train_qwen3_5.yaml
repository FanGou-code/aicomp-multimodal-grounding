# A10 24GB training run: Qwen3.5-9B.
#
# Usage: python tools/train.py --config configs/train_qwen3_5.yaml
# Precedence: CLI flags > this YAML > adapter defaults.
# Requires the GDN kernels: pip install -e ".[kernels]".
run:
  annotation_run_id: <annotation_run_id>   # from package_approved.py output
  model: qwen3_5
  model_path: models/Qwen3.5-9B
  data_dir: data
  seed: 42
  num_workers: 0            # no forking after CUDA init; data prep is light
  checkpoint_interval: 20
  run_tag: qwen3_5-a10
hyperparameters:
  batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 1.0e-4
  epochs: 3
  eval_batch_size: 1        # validation OOM aborts the run; keep it conservative
  best_metric: acc_at_0_5
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.05
  warmup_ratio: 0.05
  lr_scheduler_type: cosine
  max_grad_norm: 1.0
  weight_decay: 0.01
  max_pixels: 2408448       # 3072 patches = lossless 1080p; raises VRAM
  gradient_checkpointing: true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aicomp-grounding"
version = "1.0.0"
description = "RGB-trained visual grounding system and its annotation tool"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    # 基础与数据格式依赖
    "numpy>=1.26",
    "pillow>=10.0",
    # 运行配置（YAML + CLI override）
    "pyyaml>=6.0",
    # 框架层：精确 pin。Linux 上 PyPI 的 torch 2.14.0 为 CUDA 13 构建。
    "torch==2.14.0",
    "torchvision==0.29.0",
    # 模型框架层：== 紧 pin，跨平台行为一致
    "transformers==5.17.0",
    "peft==0.21.0",
    "accelerate==1.15.0",
    "qwen-vl-utils==0.0.14",
    # Qwen3.5 的 GDN 线性注意力 kernel（GDN 占其 3/4 层、约 90% 的 GDN 计算量）。
    # 纯 Python + Triton（运行时 JIT 编译），约 2MB、无预编译步骤；只在 qwen3_5
    # 路径被 transformers 动态导入，qwen3vl / glm46v 不受影响。
    "flash-linear-attention==0.5.2",
]

[project.optional-dependencies]
# 本地开发与运维：代码检查 + 魔搭数据集/模型下载 CLI（上传脚本在 local/，不入库）。
dev = ["ruff", "modelscope-hub>=0.4.2"]

[project.urls]
Homepage = "https://github.com/FanGou-code/aicomp-multimodal-grounding"
Repository = "https://github.com/FanGou-code/aicomp-multimodal-grounding"
Issues = "https://github.com/FanGou-code/aicomp-multimodal-grounding/issues"

[tool.setuptools.packages.find]
include = ["aicomp_grounding*"]

[tool.setuptools.package-data]
"aicomp_grounding.grounding" = ["prompts/*.md"]
"aicomp_grounding.annotator" = ["static/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# 窄规则集：只启用能发现明显错误的检查（E4/E7/E9 语法与导入；F 未定义名、
# 未用导入、重定义）。B905、TRY003/TRY004、ARG、SIM、C4、RET 不启用。
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Entrypoints insert the repository root into sys.path before importing the package.
"tools/*.py" = ["E402"]

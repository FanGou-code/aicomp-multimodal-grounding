[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aicomp-grounding"
version = "1.0.0"
description = "RGBDT tri-modal visual grounding experiment unit (competition)"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "pillow>=9.0",
    "opencv-python-headless>=4.5",
    "numpy>=1.21",
]

[project.optional-dependencies]
hub = ["modal>=0.62", "modelscope>=1.15.0"]

[tool.setuptools.packages.find]
include = ["aicomp_grounding*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Entrypoints insert the repository root into sys.path before importing the package.
"scripts/*.py" = ["E402"]
"offline/*.py" = ["E402"]

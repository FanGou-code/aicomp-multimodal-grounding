[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aicomp-grounding"
version = "1.0.0"
description = "RGBDT tri-modal visual grounding experiment unit (competition)"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    # 基础库：本地 CPU 测试与数据预处理共用
    "numpy>=1.26",
    "pillow>=10.0",
    "opencv-python-headless>=4.9",
    # 框架层：范围不 pin —— 平台已有版本（DSW A 卡 2.11 / N 卡 2.10）
    # 落在范围内即被 pip 判定已满足而跳过，不覆盖镜像自带的 torch
    "torch>=2.8,<3",
    # 模型框架层：== 紧 pin，跨平台行为一致
    "transformers==5.14.1",
    "peft==0.19.1",
    "accelerate==1.14.0",
    "qwen-vl-utils==0.0.14",
]

[project.optional-dependencies]
# 仅混合线性注意力架构（Qwen3.5-9B 的 GDN）接入时按需装；
# A 卡上 causal-conv1d 无 HIP 预编译轮，源码编译步骤见 docs/sop.md 第 3 节
kernels = ["flash-linear-attention", "causal-conv1d"]
# 云端/数据集工具，仅用 Modal 或魔搭的人需要
hub = ["modal>=0.62", "modelscope>=1.15"]
dev = ["ruff"]

[tool.setuptools.packages.find]
include = ["aicomp_grounding*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Entrypoints insert the repository root into sys.path before importing the package.
"scripts/*.py" = ["E402"]
"offline/*.py" = ["E402"]

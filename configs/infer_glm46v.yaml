# A10 24GB inference run: GLM-4.6V-Flash.
#
# Usage: python tools/infer.py --config configs/infer_glm46v.yaml
# Precedence: CLI flags > this YAML > defaults.
# lora_path: the best-epoch adapter directory, e.g. .../best/epoch_02.
# The epoch number is the best_metric winner; check `ls` after training
# (or use last/ for the final-epoch adapter instead).
run:
  model: glm46v
  model_path: models/GLM-4.6V-Flash
  lora_path: outputs/training/<training_run_id>/best/<best_epoch>
  test_json: data/Test/queries/queries.json
  data_dir: data
  max_pixels: 2408448       # 3072 patches = lossless 1080p
  batch_size: 2
  num_shards: 1
  num_workers: 2
  batch_save: 100
  run_tag: glm46v-a10

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # [pipeline] carries Pillow + numpy, needed by the depth/view tests.
      # The review tool layer stays dependency-free and is covered by the same run.
      - run: pip install -e ".[pipeline]" ruff
      - run: ruff check .
      - run: python -m unittest discover -s tests -v
